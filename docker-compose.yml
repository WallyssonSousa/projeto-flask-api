version: '3.8'

services:

  #API
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask-api:1.0
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
    volumes:
      - .:/app
    depends_on:
      - db

  #Banco de Dados
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: app
      MYSQL_USER: api
      MYSQL_PASSWORD: 12345678
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
